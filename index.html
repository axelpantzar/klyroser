<script>
    const companies = [
        'nystartade företag',
        'e-handelsföretag',
        'lokala företag',
        'tech-startups',
        'restauranger',
        'konsultföretag',
        'detaljhandeln'
    ];

    let companyIndex = 0;
    let charIndex = 0;
    let isDeleting = false;
    const typedTextElement = document.getElementById('typed-text');

    function typeWriter() {
        const currentCompany = companies[companyIndex];

        if (isDeleting) {
            typedTextElement.textContent = currentCompany.substring(0, charIndex - 1);
            charIndex--;
        } else {
            typedTextElement.textContent = currentCompany.substring(0, charIndex + 1);
            charIndex++;
        }

        let typeSpeed = isDeleting ? 50 : 100;

        if (!isDeleting && charIndex === currentCompany.length) {
            typeSpeed = 2000; // paus vid slutet
            isDeleting = true;
        } else if (isDeleting && charIndex === 0) {
            isDeleting = false;
            companyIndex = (companyIndex + 1) % companies.length; // gå till nästa företag
            typeSpeed = 500;
        }

        setTimeout(typeWriter, typeSpeed);
    }

    setTimeout(typeWriter, 1500); // start efter liten fördröjning
</script>
