    <title>Klyro - Digital närvaro som gör skillnad</title>

    <style>
        /* Grundinställningar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        /* Bakgrund */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.03) 0%, transparent 25%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.01) 50%, transparent 70%),
                repeating-linear-gradient(90deg,
                    transparent,
                    transparent 50px,
                    rgba(255, 255, 255, 0.01) 50px,
                    rgba(255, 255, 255, 0.01) 51px);
            animation: abstractMove 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes abstractMove {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            50% {
                transform: translate(-5%, -5%) rotate(5deg);
            }
        }

        section {
            position: relative;
            z-index: 1;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: transparent;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }

        nav.hidden {
            transform: translateY(-100%);
        }

        .logo {
            height: 40px;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo img {
            height: 100%;
            width: auto;
            display: block;
        }

        .nav-link {
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1.5rem;
            border: 1px solid #fff;
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background: #fff;
            color: #000;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            padding-top: 8rem;
            position: relative;
        }

        .hero h1 {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 2rem;
            letter-spacing: -0.03em;
            animation: fadeInUp 1s ease;
            text-transform: uppercase;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero p {
            font-size: clamp(1.2rem, 2vw, 1.5rem);
            color: #999;
            max-width: 600px;
            margin-bottom: 3rem;
            line-height: 1.6;
            animation: fadeInUp 1s ease 0.2s both;
        }

        .typewriter-container {
            font-size: clamp(1.2rem, 2vw, 1.5rem);
            color: #fff;
            margin-bottom: 3rem;
        }
    </style>
</head>
